services:
  postgres:
    image: postgres:18.6-alpine
    container_name: training-brain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: training_brain
      POSTGRES_USER: training_brain
      POSTGRES_PASSWORD: training_brain
    ports:
      - "5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U training_brain -d training_brain"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    container_name: training-brain-keycloak
    restart: unless-stopped
    env_file:
      - .env.local
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        export KC_BOOTSTRAP_ADMIN_USERNAME="$$KEYCLOAK_ADMIN_USERNAME";
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$KEYCLOAK_ADMIN_PASSWORD";
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
